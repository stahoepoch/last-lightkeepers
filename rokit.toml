# Toolchain manifest. Rojo is pinned to the version already installed on this
# machine (verified 7.7.1). The rest are not pinned here because I won't guess
# version numbers I haven't verified — add them with rokit, which resolves the
# current release:
#
#   rokit add JohnnyMorganz/luau-lsp     # typechecking — the project has none
#   rokit add Kampfkarren/selene         # linting
#   rokit add JohnnyMorganz/StyLua       # formatting
#   rokit add lune-org/lune              # run Luau outside Roblox, for real unit tests
#
# Then `rokit install` in this directory. That also puts rojo on PATH, which it
# currently isn't for either agent.

[tools]
rojo = "rojo-rbx/rojo@7.7.1"
