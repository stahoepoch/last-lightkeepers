name: Validate portable project contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This is deliberately the fast, engine-independent gate. Unreal
      # automation runs locally until a maintained Windows UE 5.8.4 runner is
      # provisioned; ubuntu-latest must not claim that it ran the editor.
      - name: Validate portable data and archive checks
        run: npm test
