<text x="70.0" y="633.0" font-size="7.5" fill="#555">Suspended tile at 5.14 m, 300 cm grid. Four mirrored coffers 1400 &#215; 950 cm turned 45&#176;, at (&#177;2625, &#177;1200), recessed 124 cm up into the plenum, mirror on the flat top and on all four slopes.</text>
<text x="70.0" y="645.0" font-size="7.5" fill="#555">A mirror needs no daylight, so the deck overhead now costs nothing: the coffer takes the plenum as its depth. It doubles every troffer near it, and in the dark it doubles the lantern.</text>
