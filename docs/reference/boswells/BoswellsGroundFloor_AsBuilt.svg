<text x="60.0" y="545.0" font-size="6.4" fill="#111">20 carpeted cells, 1721 m&#178;. 5 left as hard floor, the way a counter hall and a stock room are. 16 case units ring the well.</text>
<text x="60.0" y="557.0" font-size="6.4" fill="#111">The 165 cm walkway is the gap: the carpet stops at the cell edge, so what the player sees between departments is bare tile.</text>
<text x="60.0" y="569.0" font-size="6.4" fill="#1c6b2e">Every carpet matches its cell; every mirror is where the plan puts it, turned 45&#176;, below the tile.</text>
