<text x="461.5" y="92.7" font-size="7" text-anchor="middle" fill="#111">GLASS / MIRRORED CANOPY + CHANDELIER</text>
<text x="461.5" y="189.8" font-size="8" text-anchor="middle" fill="#111">the only high ceiling in the building:</text>
<text x="461.5" y="207.2" font-size="8" text-anchor="middle" fill="#111">18 m wide, 14.9 m to the roof</text>
<text x="84.5" y="219.7" font-size="7.5" text-anchor="start" fill="#111">suspended tile, 5.14 m</text>
<text x="84.5" y="197.1" font-size="7.5" text-anchor="start" fill="#111">upper selling floor, 6.50 m</text>
<text x="845.8" y="77.0" font-size="7.5" text-anchor="end" fill="#111">roof, 14.88 m</text>
<text x="77.2" y="294.2" font-size="7" text-anchor="start" fill="#555">MALL ENTRANCE</text>
<text x="845.8" y="294.2" font-size="7" text-anchor="end" fill="#555">DOCK</text>
<text x="70" y="348" font-size="15" font-weight="700" fill="#111">SECTION AT X = 0, LOOKING WEST</text>
<text x="70" y="366" font-size="7.5" fill="#555">A second storey and a high ceiling cannot share a floor. The decks cover everything except the 18 m atrium, so that slot is the whole of the high, glass-roofed room.</text>
<text x="70" y="379" font-size="7.5" fill="#555">Heights as the 2026-11-22 ceiling audit read them from LLK_Boswells_OpeningPass. Widening the glass means shrinking the mezzanine; nothing else moves it.</text>
