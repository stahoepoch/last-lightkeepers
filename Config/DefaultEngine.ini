; Renderer baseline, set deliberately as one change on 2026-11-01.
; Before this, the project ran on engine defaults with NO global illumination:
; emissive materials lit only their own pixels, measured in
; docs/FINDINGS-EMISSIVE-LIGHTS-NOTHING.md. The store's visual language -
; neon as landmarks, a lantern that answers the dark, glass and reflections -
; depends on indirect light, so Lumen is the baseline rather than an option.
;
; Software tracing only for this pass. Hardware ray tracing and Virtual Shadow
; Maps are deliberately NOT enabled here: Lumen's cost is scalable and dense
; retail geometry needs measured budgets before either is added. Both are
; currently off by engine default; do not switch them on via the Project
; Settings UI without profiling, as that dialog offers to enable VSM alongside
; Lumen.
;
; GenerateMeshDistanceFields is what software tracing needs. Turning it on
; forces a rebuild of every static mesh's derived data and requires an editor
; restart.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
