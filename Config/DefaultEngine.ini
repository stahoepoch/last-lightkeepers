; Renderer baseline, set deliberately as one change on 2026-11-01.
; Before this, the project ran on engine defaults with NO global illumination:
; emissive materials lit only their own pixels, measured in
; docs/FINDINGS-EMISSIVE-LIGHTS-NOTHING.md. The store's visual language -
; neon as landmarks, a lantern that answers the dark, glass and reflections -
; depends on indirect light, so Lumen is the baseline rather than an option.
;
; Software tracing only for this pass. Hardware ray tracing and Virtual Shadow
; Maps are deliberately NOT enabled here: Lumen's cost is scalable and dense
; retail geometry needs measured budgets before either is added. Both are
; currently off by engine default; do not switch them on via the Project
; Settings UI without profiling, as that dialog offers to enable VSM alongside
; Lumen.
;
; GenerateMeshDistanceFields is what software tracing needs. Turning it on
; forces a rebuild of every static mesh's derived data and requires an editor
; restart.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True

; Exposure units. PINNED 2026-11-02 after reading the live value, not assumed.
;
; Every number the light lab produced depends on this one flag. With 0, a
; PostProcessVolume's Exposure MinBrightness/MaxBrightness are LEGACY
; LUMINANCE; with 1 they are EV100, and the engine's own help text says so.
; The sweep's whole arithmetic - L = 0.125 x 2^EV100, so the measured optimum
; of EV100 5 is a lock of 4.0 - holds only in legacy units.
;
; It read 0 live, so the lab's interpretation was right. **But it was not
; written anywhere in this project, and 0 is NOT the engine default** - the
; help text is explicit that 1 is the UE5 default and 0 is the UE4 legacy
; range. So the correct reading was being inherited from somewhere outside
; our config, and an engine update or a plugin could flip it silently. Every
; exposure value in the project would then mean something different, with
; nothing failing and no error anywhere.
;
; Writing it down converts a lucky inheritance into an authored decision.
; That is the whole of docs/ADVERSARY.md's rule: an unwritten setting is not
; a known setting, and this one was load-bearing for a week before anybody
; checked it.
;
; If this is ever changed to 1, the exposure ladder in
; docs/LIGHTLAB-PROTOCOL.md must be re-derived, not re-used.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=0

; Shader model. The engine's own default is PCD3D_SM5 (BaseEngine.ini), and
; this project's hand-written config never overrode it - the same gap that
; left global illumination unset. So the editor has been running at SM5:
;   LogD3D12RHI: Skipped NVAPI RT queries since we the feature level is below SM6
; SM6 is the UE5 default for new projects and is required by Nanite and
; Virtual Shadow Maps, both of which the production plan calls for. Without
; it the Lumen settings above risk being enabled in config and inert in the
; running editor, which would look exactly like the no-GI behaviour they are
; meant to replace.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
